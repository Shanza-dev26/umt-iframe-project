<!DOCTYPE html>
<html>
<head>
    <title>My UMT Website Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background-color: #17365D;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .content {
            padding: 20px;
        }

        iframe {
            width: 95%;
            height: 600px;
            border: 2px solid #17365D;
        }

        footer {
            background-color: #17365D;
            color: white;
            padding: 15px;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            background-color: #17365D;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin: 15px;
        }

        a:hover {
            background-color: #315a89;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My Web Development Assignment</p>
    </header>

    <div class="content">

        <h2>University of Management and Technology</h2>

        <p>
            Below is an attempt to embed UMT's website using iframe.
        </p>

        <iframe src="https://www.umt.edu.pk/">
        </iframe>

    </div>

    <p>
        If the UMT website cannot be displayed below,
        you can visit it directly.
    </p>

    <a href="https://www.umt.edu.pk/" target="_blank">
        Open UMT Website
    </a>

    <footer>
        <p>Educational project only. Not affiliated with UMT.</p>
    </footer>

</body>
</html>
